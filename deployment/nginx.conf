server {
    listen 80;
    server_name teks-invoice.com www.teks-invoice.com api.teks-invoice.com;
    
    # Redirect all HTTP traffic to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name teks-invoice.com www.teks-invoice.com api.teks-invoice.com;

    # Cloudflare Origin Certificates
    ssl_certificate /etc/ssl/certs/teks-invoice-origin.pem;
    ssl_certificate_key /etc/ssl/private/teks-invoice-origin.key;

    # SSL Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    root /opt/invoice-builder/frontend/dist;
    index index.html;

    # Vue SPA HTML5 History Mode Routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API Requests to Go Backend
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy Assets to Go Backend
    location /asset/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
    }

    # Proxy Health Check
    location /healthz {
        proxy_pass http://127.0.0.1:4000;
    }

    # Proxy Webhooks
    location /webhook/ {
        proxy_pass http://127.0.0.1:4000;
    }
}
