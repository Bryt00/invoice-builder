{{define "public_nav"}}
<header class="no-print w-full sticky top-0 z-50 bg-surface/80 backdrop-blur-md border-b border-outline-variant/40">
    <div class="flex justify-between items-center h-16 px-4 sm:px-6 max-w-7xl mx-auto">
        <a href="/" class="flex items-center gap-2.5 group">
            <img src="/asset/img/brand_logo.png" alt="Teks-Invoice Logo"
                class="w-8 h-8 rounded-lg object-contain shadow-sm group-hover:scale-105 transition-transform">
            <span class="brand-title font-headline text-xl font-bold text-on-surface">Teks-Invoice</span>
        </a>
        <!-- Desktop Nav Links -->
        <nav class="hidden md:flex items-center gap-6 font-label text-sm font-medium text-on-surface-variant">
            <a class="hover:text-primary transition-colors" href="/">Home</a>
            <a class="hover:text-primary transition-colors" href="/#features">Features</a>
            <a class="hover:text-primary transition-colors" href="/#pricing">Pricing</a>
            <a class="hover:text-primary transition-colors" href="/contact">Support</a>
        </nav>
        <!-- CTA Buttons -->
        <div class="flex items-center gap-3">
            {{if .IsAuthenticated}}
            <a href="/user/dashboard"
                class="btn-auth-submit text-on-primary rounded-xl px-4 py-2 font-label text-xs sm:text-sm font-semibold flex items-center gap-1.5 shadow-sm">
                <span class="material-symbols-outlined text-[18px]">dashboard</span>
                <span>Dashboard</span>
            </a>
            {{else}}
            <a href="/user/login"
                class="font-label text-xs sm:text-sm font-semibold text-on-surface hover:text-primary transition-colors px-3 py-2">
                Sign In
            </a>
            <a href="/user/register"
                class="btn-auth-submit text-on-primary rounded-xl px-4 py-2 font-label text-xs sm:text-sm font-semibold shadow-sm">
                Get Started
            </a>
            {{end}}
        </div>
    </div>
</header>
{{end}}
